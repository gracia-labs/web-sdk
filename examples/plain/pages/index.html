<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gracia Player</title>
    <script type="importmap">{ "imports": {
        "@gracia/web-sdk/aio": "/dist/GraciaAIO.__SDK_HASH__.js",
        "@gracia/web-sdk/wasm": "/dist/GraciaWebCore.__WASM_HASH__.js"
    } }</script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background: #0d1115; color: #e9f2ff; font-family: system-ui, sans-serif; }
        #player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
        .page-status {
            position: fixed;
            top: 16px;
            left: 50%;
            z-index: 50;
            max-width: min(420px, calc(100vw - 32px));
            transform: translateX(-50%);
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(38,40,43,.82);
            color: rgba(233,242,255,.86);
            font: 400 13px/1.4 system-ui, sans-serif;
            box-shadow: 0 4px 32px rgba(0,0,0,.25);
            backdrop-filter: blur(12px);
        }
        .page-status.error {
            border-color: rgba(248,113,113,.28);
            background: rgba(127,29,29,.82);
            color: rgba(255,255,255,.92);
        }
        .page-status[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <div id="status" class="page-status" hidden></div>

    <script type="module">
        import { buildApiSources, mountGraciaPlayer } from '@gracia/web-sdk/aio';

        const STREAMING_BASE = '/api/market/api/v1/streaming/content';
        const DEMO_DOMAIN = '__DEMO_DOMAIN__';
        const DEMO_URL = `/api/market/api/v1/demo${DEMO_DOMAIN ? `?domain=${DEMO_DOMAIN}` : ''}`;
        const DEMO_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NzMyMjg4OTcsImV4cCI6MTg5NDM2MTY0MH0.U9kEeoph8JFV9zZ9ht7F7NAFpaLRIKRuMyFAYR9xqsw';
        const AMPLITUDE_KEY = '__AMPLITUDE_KEY__';

        const root = document.getElementById('player');
        const status = document.getElementById('status');

        const localFilesEnabled = !DEMO_DOMAIN;

        let amp = null;
        let ampQueue = [];
        if (AMPLITUDE_KEY && !AMPLITUDE_KEY.startsWith('__')) {
            import('https://cdn.jsdelivr.net/npm/@amplitude/analytics-browser@2/+esm').then((m) => {
                m.init(AMPLITUDE_KEY, {
                    serverUrl: location.origin + '/api/amp/2/httpapi',
                    defaultTracking: true,
                    transport: 'beacon',
                });
                amp = m;
                for (const [name, props] of ampQueue) amp.track(name, props);
                ampQueue = null;
            }).catch(() => { ampQueue = null; });
        }

        let loadedSources = [];
        let cameraControlsEnabled = false;
        let currentSource = null;
        let activeMode = 'pw';
        let firstReady = false;
        let sessionStartTime = 0;
        let maxSceneOpened = 0;

        const formatError = (error) => error instanceof Error ? error.message : String(error);
        const showStatus = (message, kind = 'info') => {
            status.hidden = false;
            status.classList.toggle('error', kind === 'error');
            status.textContent = message;
        };
        const clearStatus = () => {
            status.hidden = true;
            status.classList.remove('error');
            status.textContent = '';
        };

        const track = (name, props) => {
            const ev = {
                domain: location.hostname,
                url: location.href,
                session_type: activeMode === 'vr' || activeMode === 'ar' ? 'vr' : '2d',
                content_name: currentSource?.displayName || currentSource?.label,
                content_id: currentSource?.id,
                ...props,
            };
            if (amp) { amp.track(name, ev); return; }
            if (ampQueue) ampQueue.push([name, ev]);
        };

        const endSession = () => {
            if (!sessionStartTime) return;
            track('streaming_session_ended', {
                duration: Math.round((Date.now() - sessionStartTime) / 1000),
                max_scene_opened: maxSceneOpened,
            });
            sessionStartTime = 0;
        };

        const EVT_MAP = {
            play_pause: (d) => d?.playing ? 'streaming_play_clicked' : 'streaming_pause_clicked',
            seek: () => 'streaming_rewinded',
            mute_toggle: (d) => d?.muted ? 'streaming_mute_clicked' : 'streaming_unmute_clicked',
            reset: () => 'streaming_reset_clicked',
            preset_cycle: () => 'streaming_light_mode_switched',
            exit: () => { endSession(); return 'streaming_quit_scene_clicked'; },
            local_file_open: () => 'streaming_local_file_opened',
        };

        const reportPlayerError = (error, data) => {
            track('streaming_launch_failed', {
                errorType: error?.name,
                errorMessage: formatError(error),
                phase: data?.phase,
            });
        };

        const syncMode = (mode) => {
            if (!mode || mode === activeMode) return;
            if ((mode === 'vr' || mode === 'ar') && activeMode === 'pw') {
                track('player_streaming_launch_in_vr_clicked');
            }
            activeMode = mode;
        };

        const baseProps = () => ({
            sources: loadedSources,
            localFiles: localFilesEnabled,
            moduleUrl: '@gracia/web-sdk/wasm',
            sceneSelector: 'menu',
            controls: true,
            cameraControls: cameraControlsEnabled,
            style: { borderRadius: 0 },
            onReady: () => {
                if (!firstReady) sessionStartTime = Date.now();
                firstReady = true;
                track('streaming_launch_success', { source: 'vega' });
            },
            onSceneChange: (source, index) => {
                currentSource = source;
                maxSceneOpened = Math.max(maxSceneOpened, index + 1);
                track('streaming_loading', { scene_index: index + 1 });
            },
            eventLogger: {
                event: (name, data) => {
                    if (data?.mode) syncMode(data.mode);
                    const fn = EVT_MAP[name];
                    if (fn) track(fn(data));
                },
            },
            onError: reportPlayerError,
        });

        const player = mountGraciaPlayer(root, { ...baseProps(), sources: [] });
        const applyProps = () => player.update(baseProps());

        const isTextInputTarget = (target) => {
            if (!(target instanceof HTMLElement)) return false;
            return ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) || target.isContentEditable;
        };

        const toggleCameraControls = () => {
            cameraControlsEnabled = !cameraControlsEnabled;
            applyProps();
        };

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'KeyM' || event.ctrlKey || event.metaKey || event.altKey) return;
            if (isTextInputTarget(event.target)) return;
            event.preventDefault();
            toggleCameraControls();
        }, { capture: true });

        addEventListener('beforeunload', () => {
            endSession();
            amp?.flush();
        });

        async function loadDemoSources() {
            const response = await fetch(DEMO_URL);
            if (!response.ok) throw new Error(`Demo API returned ${response.status}`);
            const demos = await response.json();
            const resolved = [];
            const streaming = [];

            for (const demo of demos) {
                if (demo.rawMetadata && Object.keys(demo.rawMetadata).length > 0) {
                    resolved.push(demo.rawMetadata);
                } else if (demo.streamingId) {
                    streaming.push({
                        streamingId: demo.streamingId,
                        token: DEMO_TOKEN,
                        label: demo.label,
                        settings: { resetPositionOnStart: true },
                    });
                } else {
                    console.warn('[index] demo item has no rawMetadata or streamingId:', demo);
                }
            }

            const built = await Promise.allSettled(
                streaming.map((item) => buildApiSources([item], STREAMING_BASE))
            );
            for (const result of built) {
                if (result.status === 'fulfilled') {
                    resolved.push(...result.value);
                } else {
                    console.warn('[index] streaming metadata failed:', result.reason);
                }
            }

            return resolved;
        }

        async function loadConfiguredSources() {
            const response = await fetch('/api/sources');
            if (!response.ok) throw new Error(`Sources API returned ${response.status}`);
            const raw = (await response.json()).sources ?? [];
            const resolved = [];
            for (const src of raw) {
                if (src.items?.length) {
                    resolved.push(...await buildApiSources(src.items, src.baseUrl ?? STREAMING_BASE));
                } else {
                    resolved.push(src);
                }
            }
            return resolved;
        }

        try {
            const results = await Promise.allSettled([loadDemoSources(), loadConfiguredSources()]);
            let anyFailed = false;

            for (const result of results) {
                if (result.status === 'fulfilled') {
                    loadedSources.push(...result.value);
                } else {
                    anyFailed = true;
                    console.warn('[index] content feed failed:', result.reason);
                }
            }

            if (loadedSources.length === 0) {
                throw new Error('No content sources loaded');
            }

            applyProps();
            clearStatus();

            if (anyFailed) {
                showStatus('Some content feeds failed; showing partial playlist.');
            }
        } catch (error) {
            track('streaming_launch_failed', {
                errorType: error?.name,
                errorMessage: formatError(error),
            });
            const hint = localFilesEnabled ? ' You can still open a local file.' : '';
            showStatus(`${formatError(error)}.${hint}`, 'error');
        }

        window.graciaPlayer = player;
    </script>
</body>
</html>
